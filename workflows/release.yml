name: Windows release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build desktop executable
        run: pyinstaller --noconfirm --clean --windowed --onedir --name AssessmentScheduler main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { $version = 'v1.0.0' }
          $env:APP_VERSION = $version.Substring(1)
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\AssessmentScheduler.iss'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssessmentScheduler-Windows
          path: dist-installer/*.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create '${{ github.ref_name }}' dist-installer/*.exe --generate-notes --title 'Assessment Scheduler ${{ github.ref_name }}'
